<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>YOSHUKAN CUP 2027 - Iscrizione Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- SDK EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // Inizializzazione EmailJS con la tua Public Key
            emailjs.init("2_4vE-yW-JhTezDTq");
        })();
    </script>
    <style>
        .preview-img { width: 50px; height: 50px; object-fit: cover; border-radius: 50%; border: 1px solid #dee2e6; display: none; }
        .preview-locandina { max-height: 350px; object-fit: contain; border-radius: 8px; border: 1px solid #dee2e6; display: block; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow border-0 p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">🥋 YOSHUKAN CUP 2027</h2>
                        <p class="text-muted">Domenica 11 Ottobre - Palazzetto dello Sport Marco Saitta (Misilmeri)</p>
                    </div>

                    <div id="messaggioStato"></div>

                    <!-- 1. DATI DEL TORNEO E LOCANDINA FISSA -->
                    <div class="card p-3 mb-4 bg-white shadow-sm border-primary">
                        <h5 class="fw-bold text-primary mb-3 text-center">🏆 Locandina Ufficiale Evento</h5>
                        <div class="text-center">
                            <!-- Locandina fissa con percorso pulito senza spazi -->
                            <img id="locandinaFissa" src="locandina.jpg" class="preview-locandina mb-3" alt="Yoshukan Cup 2027 Locandina" onerror="this.style.display='none'">
                            <input type="text" id="regNomeTorneo" class="form-control text-center fw-bold text-dark bg-light" value="YOSHUKAN CUP 2027 - 11 Ottobre" readonly>
                        </div>
                    </div>

                    <!-- 2. DATI DELLA SOCIETÀ -->
                    <div class="card p-3 mb-4 bg-white shadow-sm">
                        <h5 class="fw-bold text-dark mb-3">🏢 Dati Società, Tecnico & Immagini</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nome Società</label>
                                <input type="text" id="regNomeSocieta" class="form-control" placeholder="Es. Asd Karate Club Palermo" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nome Tecnico / Referente</label>
                                <input type="text" id="regNomeTecnico" class="form-control" placeholder="Es. Sensei Mario Rossi" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" id="regEmailSocieta" class="form-control" placeholder="email@societa.it">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Telefono</label>
                                <input type="text" id="regTelSocieta" class="form-control" placeholder="3331234567">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Logo Società</label>
                                <div class="input-group">
                                    <input type="file" id="regLogoFile" class="form-control" accept="image/*" onchange="comprimiImmagine(this, 'logoPreview', 'logo', 300)">
                                    <img id="logoPreview" class="preview-img ms-2">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Foto Tecnico / Maestro</label>
                                <div class="input-group">
                                    <input type="file" id="regFotoTecnicoFile" class="form-control" accept="image/*" onchange="comprimiImmagine(this, 'fotoTecnicoPreview', 'tecnico', 300)">
                                    <img id="fotoTecnicoPreview" class="preview-img ms-2">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. ELENCO ATLETI -->
                    <div class="card p-3 mb-4 bg-white shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold text-dark mb-0">👥 Elenco Atleti della Società</h5>
                            <button type="button" class="btn btn-sm btn-outline-primary fw-bold" onclick="aggiungiRigaAtletaForm()">➕ Aggiungi Atleta</button>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle" id="tabellaAtletiForm">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nome</th>
                                        <th>Cognome</th>
                                        <th>Data Nascita</th>
                                        <th>Sesso</th>
                                        <th>Cintura</th>
                                        <th>Specialità</th>
                                        <th>Peso (Kg)</th>
                                        <th style="width: 50px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="righeAtletiBody">
                                    <!-- Righe dinamiche -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <button class="btn btn-success w-100 py-3 fw-bold fs-5" onclick="inviaIscrizioneAlTorneo()">🚀 Invia Iscrizione Definitiva</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const firebaseConfig = {
            databaseURL: "https://yoshukan-cup-2027-1a-giornata-default-rtdb.firebaseio.com/"
        };
        
        let usaFirebase = false;
        if (firebaseConfig.databaseURL !== "INSERISCI_QUI_IL_TUO_DATABASE_URL_FIREBASE") {
            firebase.initializeApp(firebaseConfig);
            var database = firebase.database();
            usaFirebase = true;
        }

        let logoBase64Temp = "";
        let fotoTecnicoBase64Temp = "";

        window.onload = function() {
            aggiungiRigaAtletaForm();
        }

        function comprimiImmagine(input, previewId, tipo, maxDimensione) {
            let file = input.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                let img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDimensione) {
                            height *= maxDimensione / width;
                            width = maxDimensione;
                        }
                    } else {
                        if (height > maxDimensione) {
                            width *= maxDimensione / height;
                            height = maxDimensione;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    let base64String = canvas.toDataURL('image/jpeg', 0.7);

                    let imgPreview = document.getElementById(previewId);
                    imgPreview.src = base64String;
                    imgPreview.style.display = 'inline-block';

                    if (tipo === 'logo') logoBase64Temp = base64String;
                    if (tipo === 'tecnico') fotoTecnicoBase64Temp = base64String;
                }
            };
            reader.readAsDataURL(file);
        }

        function aggiungiRigaAtletaForm() {
            let tbody = document.getElementById('righeAtletiBody');
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="form-control form-control-sm atl-nome" placeholder="Nome"></td>
                <td><input type="text" class="form-control form-control-sm atl-cognome" placeholder="Cognome"></td>
                <td><input type="date" class="form-control form-control-sm atl-nascita"></td>
                <td>
                    <select class="form-select form-select-sm atl-sesso">
                        <option value="M">M</option>
                        <option value="F">F</option>
                    </select>
                </td>
                <td>
                    <select class="form-select form-select-sm atl-cintura">
                        <option value="Bianca">Bianca</option>
                        <option value="Gialla">Gialla</option>
                        <option value="Arancione">Arancione</option>
                        <option value="Verde">Verde</option>
                        <option value="Blu">Blu</option>
                        <option value="Marrone">Marrone</option>
                        <option value="Nera">Nera</option>
                    </select>
                </td>
                <td>
                    <select class="form-select form-select-sm atl-specialita">
                        <option value="Kata">Kata</option>
                        <option value="Kumite">Kumite</option>
                        <option value="Entrambi">Entrambi</option>
                    </select>
                </td>
                <td><input type="number" step="0.1" class="form-control form-control-sm atl-peso" placeholder="Kg"></td>
                <td class="text-center">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function inviaIscrizioneAlTorneo() {
            let nomeTorneo = document.getElementById('regNomeTorneo').value.trim();
            let nomeSoc = document.getElementById('regNomeSocieta').value.trim();
            let nomeTec = document.getElementById('regNomeTecnico').value.trim();
            let emailSoc = document.getElementById('regEmailSocieta').value.trim();
            let telSoc = document.getElementById('regTelSocieta').value.trim();

            if (!nomeSoc || !nomeTec) {
                alert("Inserisci il Nome Società e il Nome del Tecnico!");
                return;
            }

            let righe = document.querySelectorAll('#righeAtletiBody tr');
            let novosAtleti = [];

            righe.forEach(r => {
                let nome = r.querySelector('.atl-nome').value.trim();
                let cognome = r.querySelector('.atl-cognome').value.trim();
                let dataNascita = r.querySelector('.atl-nascita').value;
                let sesso = r.querySelector('.atl-sesso').value;
                let cintura = r.querySelector('.atl-cintura').value;
                let specialita = r.querySelector('.atl-specialita').value;
                let peso = parseFloat(r.querySelector('.atl-peso').value) || 0;

                if (nome && cognome) {
                    novosAtleti.push({
                        id: Date.now() + Math.random(),
                        nome,
                        cognome,
                        dataNascita,
                        sesso,
                        cintura,
                        specialita,
                        peso,
                        societa: nomeSoc,
                        torneo: nomeTorneo
                    });
                }
            });

            if (novosAtleti.length === 0) {
                alert("Inserisci almeno un atleta valido con Nome e Cognome!");
                return;
            }

            let datiSocietaCompleti = {
                id: Date.now(),
                nomeTorneo: nomeTorneo,
                locandina: "locandina.jpg",
                nome: nomeSoc,
                tecnico: nomeTec,
                email: emailSoc,
                telefono: telSoc,
                logo: logoBase64Temp,
                fotoTecnico: fotoTecnicoBase64Temp,
                dataRegistrazione: new Date().toLocaleString()
            };

            if (usaFirebase) {
                database.ref('iscrizioni_pendenti/' + datiSocietaCompleti.id).set({
                    societa: datiSocietaCompleti,
                    atleti: novosAtleti
                }, (error) => {
                    if (error) {
                        alert("Errore durante l'invio: " + error.message);
                    } else {
                        // Invio email di notifica tramite EmailJS con il Template ID corretto
                        let templateParams = {
                            societa_nome: nomeSoc,
                            tecnico_nome: nomeTec,
                            num_atleti: novosAtleti.length,
                            nome_torneo: nomeTorneo,
                            email_societa: emailSoc || "Non specificata",
                            telefono_societa: telSoc || "Non specificato"
                        };

                        emailjs.send('service_17vqdun', 'template_cexv9yys', templateParams)
                            .then(function(response) {
                                console.log('Email inviata con successo!', response.status, response.text);
                            }, function(error) {
                                console.log('Errore invio email:', error);
                            });

                        mostraSuccesso();
                    }
                });
            } else {
                alert("Errore di connessione a Firebase.");
            }
        }

        function mostraSuccesso() {
            document.getElementById('messaggioStato').innerHTML = `
                <div class="alert alert-success text-center fw-bold py-3">
                    🎉 Iscrizione inviata con successo! Ti è stata notificata l'email.
                </div>
            `;
            setTimeout(() => {
                location.reload();
            }, 3000);
        }
    </script>
</body>
</html>
