<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modulo Iscrizione Online - Torneo Karate I.K.S.A.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-card { border-top: 5px solid #25d366; background: #fff; }
    </style>
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 700px;">
        
        <div class="text-center mb-4">
            <h1 class="fw-bold">🥋 Modulo Iscrizione Online</h1>
            <p class="text-muted">Compila il modulo per inviare direttamente l'iscrizione via WhatsApp all'organizzazione.</p>
        </div>

        <div class="card shadow-sm p-4 form-card">
            <h3 class="mb-3 text-success">Inserisci Dati Atleta</h3>
            <form onsubmit="inviaIscrizioneWhatsApp(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold">Il tuo Numero di Telefono (o del Maestro/Referente)</label>
                    <input type="tel" id="inputTelefonoOrg" class="form-control" value="393899216447" placeholder="Es. 393899216447" required>
                    <div class="form-text">Numero WhatsApp dell'organizzatore a cui arriverà il messaggio.</div>
                </div>
                <hr>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nome Atleta</label>
                    <input type="text" id="inputNome" class="form-control" placeholder="Es. Mario" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Cognome Atleta</label>
                    <input type="text" id="inputCognome" class="form-control" placeholder="Es. Rossi" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Data di Nascita</label>
                    <input type="date" id="inputDataNascita" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Sesso</label>
                    <select id="inputSesso" class="form-select" required>
                        <option value="">Seleziona sesso...</option>
                        <option value="M">Maschio (M)</option>
                        <option value="F">Femmina (F)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nome Società Sportiva</label>
                    <input type="text" id="inputSocieta" class="form-control" placeholder="Es. ASD Ken Zen" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Cintura</label>
                    <select id="inputCintura" class="form-select" required>
                        <option value="Bianca">Bianca</option>
                        <option value="Gialla">Gialla</option>
                        <option value="Arancione">Arancione</option>
                        <option value="Verde">Verde</option>
                        <option value="Blu">Blu</option>
                        <option value="Marrone">Marrone</option>
                        <option value="Nera">Nera</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Specialità</label>
                    <select id="inputSpecialita" class="form-select" required>
                        <option value="Kata">Kata</option>
                        <option value="Kumite">Kumite</option>
                        <option value="Entrambi">Entrambi (Kata e Kumite)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 py-3 fw-bold shadow-sm fs-5">💬 Invia Iscrizione via WhatsApp</button>
            </form>
            <div id="messaggioConferma" class="mt-3"></div>
        </div>

    </div>

    <script>
        function inviaIscrizioneWhatsApp(e) {
            e.preventDefault();
            let telOrg = document.getElementById('inputTelefonoOrg').value.trim();
            let nome = document.getElementById('inputNome').value.trim();
            let cognome = document.getElementById('inputCognome').value.trim();
            let dataNascita = document.getElementById('inputDataNascita').value;
            let sesso = document.getElementById('inputSesso').value;
            let societa = document.getElementById('inputSocieta').value.trim();
            let cintura = document.getElementById('inputCintura').value;
            let specialita = document.getElementById('inputSpecialita').value;

            // Creazione del testo formattato per WhatsApp
            let testo = `🥋 *NUOVA ISCRIZIONE TORNEO* %0A` +
                        `----------------------------%0A` +
                        `👤 *Atleta:* ${cognome} ${nome}%0A` +
                        `🎂 *Data Nascita:* ${dataNascita}%0A` +
                        `🚻 *Sesso:* ${sesso}%0A` +
                        `📍 *Società:* ${societa}%0A` +
                        `🥋 *Cintura:* ${cintura}%0A` +
                        `🏆 *Specialità:* ${specialita}%0A` +
                        `----------------------------`;

            // Apertura di WhatsApp con il messaggio precompilato
            let urlWhatsApp = `https://api.whatsapp.com/send?phone=${telOrg}&text=${testo}`;
            window.open(urlWhatsApp, '_blank');

            document.getElementById('messaggioConferma').innerHTML = `
                <div class="alert alert-success text-center" role="alert">
                    ✅ Si sta aprendo WhatsApp con i dati di <strong>${nome} ${cognome}</strong> pronti per l'invio!
                </div>
            `;
        }
    </script>
</body>
</html>
