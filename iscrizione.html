<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modulo Iscrizione Online - Torneo Karate I.K.S.A.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-card { border-top: 5px solid #0d6efd; background: #fff; }
    </style>
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 700px;">
        
        <div class="text-center mb-4">
            <h1 class="fw-bold">🥋 Modulo Iscrizione Online</h1>
            <p class="text-muted">Compila il modulo per inviare l'iscrizione all'organizzazione via Email o WhatsApp.</p>
        </div>

        <div class="card shadow-sm p-4 form-card">
            <h3 class="mb-3 text-primary">Inserisci Dati Atleta</h3>
            <form onsubmit="inviaIscrizione(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tua Email o Email dell'Organizzazione</label>
                    <input type="email" id="inputEmailOrg" class="form-control" value="tuamail@example.com" placeholder="Inserisci la tua email" required>
                    <div class="form-text">I dati arriveranno direttamente a questo indirizzo email.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Numero WhatsApp (Opzionale)</label>
                    <input type="tel" id="inputTelefonoOrg" class="form-control" value="393899216447" placeholder="Es. 393899216447">
                </div>
                <hr>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nome Atleta</label>
                    <input type="text" id="inputNome" class="form-control" placeholder="Es. Mario" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Cognome Atleta</label>
                    <input type="text" id="inputCognome" class="form-control" placeholder="Es. Rossi" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Data di Nascita</label>
                    <input type="date" id="inputDataNascita" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Sesso</label>
                    <select id="inputSesso" class="form-select" required>
                        <option value="">Seleziona sesso...</option>
                        <option value="M">Maschio (M)</option>
                        <option value="F">Femmina (F)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nome Società Sportiva</label>
                    <input type="text" id="inputSocieta" class="form-control" placeholder="Es. ASD Ken Zen" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Cintura</label>
                    <select id="inputCintura" class="form-select" required>
                        <option value="Bianca">Bianca</option>
                        <option value="Gialla">Gialla</option>
                        <option value="Arancione">Arancione</option>
                        <option value="Verde">Verde</option>
                        <option value="Blu">Blu</option>
                        <option value="Marrone">Marrone</option>
                        <option value="Nera">Nera</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Specialità</label>
                    <select id="inputSpecialita" class="form-select" required>
                        <option value="Kata">Kata</option>
                        <option value="Kumite">Kumite</option>
                        <option value="Entrambi">Entrambi (Kata e Kumite)</option>
                    </select>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary py-3 fw-bold shadow-sm fs-5">📧 Invia Iscrizione via Email</button>
                    <button type="button" class="btn btn-success py-2 fw-bold shadow-sm" onclick="inviaWhatsAppDaModulo()">💬 Oppure Invia via WhatsApp</button>
                </div>
            </form>
            <div id="messaggioConferma" class="mt-3"></div>
        </div>

    </div>

    <script>
        function raccogliDati() {
            return {
                emailOrg: document.getElementById('inputEmailOrg').value.trim(),
                telOrg: document.getElementById('inputTelefonoOrg').value.trim(),
                nome: document.getElementById('inputNome').value.trim(),
                cognome: document.getElementById('inputCognome').value.trim(),
                dataNascita: document.getElementById('inputDataNascita').value,
                sesso: document.getElementById('inputSesso').value,
                societa: document.getElementById('inputSocieta').value.trim(),
                cintura: document.getElementById('inputCintura').value,
                specialita: document.getElementById('inputSpecialita').value
            };
        }

        function inviaIscrizione(e) {
            e.preventDefault();
            let d = raccogliDati();

            let oggetto = encodeURIComponent(`Nuova Iscrizione Torneo: ${d.cognome} ${d.nome}`);
            let corpo = encodeURIComponent(
                `Nuova iscrizione ricevuta dal modulo online:\n\n` +
                `- Nome Atleta: ${d.nome} ${d.cognome}\n` +
                `- Data di Nascita: ${d.dataNascita}\n` +
                `- Sesso: ${d.sesso}\n` +
                `- Società: ${d.societa}\n` +
                `- Cintura: ${d.cintura}\n` +
                `- Specialità: ${d.specialita}\n`
            );

            window.location.href = `mailto:${d.emailOrg}?subject=${oggetto}&body=${corpo}`;

            document.getElementById('messaggioConferma').innerHTML = `
                <div class="alert alert-success text-center" role="alert">
                    ✅ Si sta aprendo il programma di posta elettronica con l'iscrizione pronta per l'invio a <strong>${d.emailOrg}</strong>!
                </div>
            `;
        }

        function inviaWhatsAppDaModulo() {
            let d = raccogliDati();
            if (!d.nome || !d.cognome) {
                alert("Compila almeno Nome e Cognome dell'atleta prima di inviare.");
                return;
            }

            let testo = `🥋 *NUOVA ISCRIZIONE TORNEO* %0A` +
                        `----------------------------%0A` +
                        `👤 *Atleta:* ${d.cognome} ${d.nome}%0A` +
                        `🎂 *Data Nascita:* ${d.dataNascita}%0A` +
                        `🚻 *Sesso:* ${d.sesso}%0A` +
                        `📍 *Società:* ${d.societa}%0A` +
                        `🥋 *Cintura:* ${d.cintura}%0A` +
                        `🏆 *Specialità:* ${d.specialita}%0A` +
                        `----------------------------`;

            let urlWhatsApp = `https://api.whatsapp.com/send?phone=${d.telOrg}&text=${testo}`;
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
